name: Keep Supabase project active

on:
  schedule:
    # Run twice a week so a delayed GitHub schedule remains inside Supabase's
    # free-plan inactivity window.
    - cron: "17 3 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase health check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          supabase_url="${SUPABASE_URL%/}"
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -X POST "$supabase_url/rest/v1/rpc/healthcheck" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            --data '{}'
